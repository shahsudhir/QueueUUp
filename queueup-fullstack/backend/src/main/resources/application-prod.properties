# Production. Every secret MUST come from the environment; the app refuses to start without them.
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ORIGINS, FRONTEND_URL

# Hibernate only checks the schema; Flyway migrations are the only way to change it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Never leak internal exception text (GlobalExceptionHandler sends safe messages)
server.error.include-message=never
server.error.include-stacktrace=never

# Behind a reverse proxy / load balancer: trust X-Forwarded-* for the client IP and https
server.forward-headers-strategy=framework

logging.level.root=INFO
