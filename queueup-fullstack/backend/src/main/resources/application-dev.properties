# Local development (the default profile). Safe to commit: no real secrets.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/queueup}
spring.datasource.username=${DB_USERNAME:queueup_app}
spring.datasource.password=${DB_PASSWORD:QueueUp@2026}

# Flyway runs first; Hibernate may still add anything missing while you develop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

app.jwt.secret=${JWT_SECRET:queueup-local-development-secret-change-me-2026}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Uncomment to see every security decision while debugging 401/403
# logging.level.org.springframework.security=DEBUG
