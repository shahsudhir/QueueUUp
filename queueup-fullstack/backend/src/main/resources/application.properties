# =============================================================================
# QueueUp settings shared by every environment.
# Profile files add to / override these:
#   application-dev.properties   (default; local laptop, safe defaults)
#   application-prod.properties  (SPRING_PROFILES_ACTIVE=prod; no defaults for secrets)
# =============================================================================
spring.application.name=backend
spring.profiles.default=dev
server.port=${PORT:8080}

# --- Database (values come from the profile file / environment) -------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false

# --- Flyway: the schema is created and changed ONLY by versioned migrations --
spring.flyway.enabled=true
# An existing database created earlier by Hibernate is marked as version 1, then V2+ run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Security -----------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# --- Password reset -----------------------------------------------------------
app.frontend-url=${FRONTEND_URL}
app.mail.from=${MAIL_FROM:no-reply@queueup.app}
app.password-reset.expiry-minutes=30

# Email is OFF unless SPRING_MAIL_HOST is set in the environment (see DEPLOYMENT.md).
# Without it, reset emails are printed in the backend log.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Data retention: finished customers older than this are deleted nightly ---
app.retention.days=${RETENTION_DAYS:90}

# --- Health check -------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
