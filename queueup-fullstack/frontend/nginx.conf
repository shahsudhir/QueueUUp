server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API calls go to the Spring Boot container (same origin for the browser: no CORS needed)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Built files have content hashes in their names: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path (/s/abc-barber, /business-dashboard, ...) serves index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
